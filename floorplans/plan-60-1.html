<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1080px;height:1080px;overflow:hidden;background:#faf8f5;font-family:"Manrope",sans-serif}
  .wrap{position:relative;width:1080px;height:1080px;display:flex;flex-direction:column;padding:52px 74px 44px}
  .top{display:flex;align-items:center;justify-content:space-between}
  .brand{display:flex;align-items:center;gap:14px}
  .mark{display:flex;align-items:flex-end;gap:4px;height:32px}
  .mark i{display:block;width:8px;border-radius:2px 2px 0 0;background:linear-gradient(180deg,#e3c078,#c9a24b)}
  .mark i:nth-child(1){height:19px}.mark i:nth-child(2){height:32px}.mark i:nth-child(3){height:25px}
  .bname{font-family:"Playfair Display",serif;font-weight:700;font-size:23px;letter-spacing:.19em;color:#0f2438}
  .tag{font-size:12px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:#c9a24b;
       border:1px solid rgba(201,162,75,.5);border-radius:999px;padding:8px 16px}
  h1{margin-top:26px;font-family:"Playfair Display",serif;font-weight:900;font-size:70px;line-height:1;color:#0f2438}
  h1 em{font-style:normal;color:#c9a24b}
  .sub{margin-top:9px;font-size:24px;font-weight:600;color:rgba(15,36,56,.62)}
  .plan{flex:1;display:flex;align-items:center;justify-content:center;margin-top:8px}
  .foot{display:flex;align-items:center;justify-content:space-between;border-top:1px solid rgba(15,36,56,.13);padding-top:20px}
  .metrics{display:flex;gap:34px}
  .metric b{display:block;font-size:26px;font-weight:800;color:#0f2438;line-height:1.1}
  .metric span{font-size:13px;font-weight:600;color:rgba(15,36,56,.5)}
  .site{font-size:17px;font-weight:700;letter-spacing:.05em;color:#c9a24b}
</style></head>
<body><div class="wrap">
  <div class="top">
    <div class="brand"><div class="mark"><i></i><i></i><i></i></div><div class="bname">ELITE ESTATE</div></div>
    <div class="tag">Типовая планировка</div>
  </div>

  <h1>60 <em>м²</em></h1>
  <div class="sub">2 спальни</div>

  <div class="plan">
    <svg width="800" height="640" viewBox="0 0 800.0 640.0">
      
      <rect x="0.0" y="0.0" width="266.7" height="71.1"
            fill="#f3ece0" stroke="#c9a24b" stroke-width="2.5" stroke-dasharray="7 6" />
      <text x="133.3" y="29.6" text-anchor="middle"
            font-family="Manrope, sans-serif" font-size="18" font-weight="600"
            fill="#0f2438" opacity="0.78">Балкон</text>
      <text x="133.3" y="55.6" text-anchor="middle"
            font-family="Manrope, sans-serif" font-size="20" font-weight="800"
            fill="#c9a24b">2,4 м²</text>
      <rect x="0.0" y="71.1" width="373.3" height="471.1"
            fill="#ffffff" stroke="#0f2438" stroke-width="3.5" />
      <text x="186.7" y="300.7" text-anchor="middle"
            font-family="Manrope, sans-serif" font-size="23" font-weight="600"
            fill="#0f2438" opacity="0.78">Гостиная-кухня</text>
      <text x="186.7" y="333.7" text-anchor="middle"
            font-family="Manrope, sans-serif" font-size="27" font-weight="800"
            fill="#c9a24b">22,3 м²</text>
      <rect x="0.0" y="542.2" width="373.3" height="97.8"
            fill="#eee9e0" stroke="#0f2438" stroke-width="3.5" />
      <text x="186.7" y="585.1" text-anchor="middle"
            font-family="Manrope, sans-serif" font-size="23" font-weight="600"
            fill="#0f2438" opacity="0.78">Прихожая</text>
      <text x="186.7" y="618.1" text-anchor="middle"
            font-family="Manrope, sans-serif" font-size="27" font-weight="800"
            fill="#c9a24b">4,6 м²</text>
      <rect x="373.3" y="71.1" width="426.7" height="266.7"
            fill="#ffffff" stroke="#0f2438" stroke-width="3.5" />
      <text x="586.7" y="198.4" text-anchor="middle"
            font-family="Manrope, sans-serif" font-size="23" font-weight="600"
            fill="#0f2438" opacity="0.78">Спальня 1</text>
      <text x="586.7" y="231.4" text-anchor="middle"
            font-family="Manrope, sans-serif" font-size="27" font-weight="800"
            fill="#c9a24b">14,4 м²</text>
      <rect x="373.3" y="337.8" width="275.6" height="302.2"
            fill="#ffffff" stroke="#0f2438" stroke-width="3.5" />
      <text x="511.1" y="482.9" text-anchor="middle"
            font-family="Manrope, sans-serif" font-size="23" font-weight="600"
            fill="#0f2438" opacity="0.78">Спальня 2</text>
      <text x="511.1" y="515.9" text-anchor="middle"
            font-family="Manrope, sans-serif" font-size="27" font-weight="800"
            fill="#c9a24b">10,5 м²</text>
      <rect x="648.9" y="337.8" width="151.1" height="302.2"
            fill="#eee9e0" stroke="#0f2438" stroke-width="3.5" />
      <text x="724.4" y="482.9" text-anchor="middle"
            font-family="Manrope, sans-serif" font-size="23" font-weight="600"
            fill="#0f2438" opacity="0.78">Санузел</text>
      <text x="724.4" y="515.9" text-anchor="middle"
            font-family="Manrope, sans-serif" font-size="27" font-weight="800"
            fill="#c9a24b">5,8 м²</text>
      <rect x="0.0" y="71.1" width="800.0" height="568.9"
            fill="none" stroke="#0f2438" stroke-width="7" />
    </svg>
  </div>

  <div class="foot">
    <div class="metrics">
      <div class="metric"><b>57,6 м²</b><span>без балкона</span></div>
      <div class="metric"><b>2,4 м²</b><span>балкон</span></div>
      <div class="metric"><b>1</b><span>санузел</span></div>
    </div>
    <div class="site">eliteestate.online</div>
  </div>
</div></body></html>
